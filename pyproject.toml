[project]
name = "llm-benchmark-residual-audit"
version = "0.7.0"
description = "Evaluation-protocol-adjusted residual audit of public LLM benchmark scores"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Ed Herranz"}]
license = {text = "License to be selected before public release"}
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "matplotlib>=3.7"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
